name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install required Android SDK packages (API 37.1)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using SDK at $SDK_ROOT"
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Configure release signing keystore (if secrets are set)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis-release.jks"
            echo "keystore_path=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed_mode=Release Keystore" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "signed_mode=CI Debug Key (add JARVIS_KEYSTORE_* secrets for persistent update signing)" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build minified Release APK
        env:
          JARVIS_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PjarvisVersionName="${{ steps.meta.outputs.version }}" \
            -PjarvisVersionCode="${{ github.run_number }}" \
            --no-daemon

      - name: Prepare release artifacts & checksums
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/release/app-release.apk "release-dist/Jarvis.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-dist/Jarvis-${{ steps.meta.outputs.tag }}.apk"
          (cd release-dist && sha256sum Jarvis.apk "Jarvis-${{ steps.meta.outputs.tag }}.apk" > SHA256SUMS.txt)
          ls -lh release-dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Jarvis ${{ steps.meta.outputs.tag }}
          make_latest: true
          body: |
            ## Jarvis on Android ${{ steps.meta.outputs.tag }}

            ### Quick Install on Android
            - **Direct on phone**: Tap **`Jarvis.apk`** below to download and install directly. *(On Android 15 / Xiaomi HyperOS, unlock Restricted Settings via Settings → Apps → Manage apps → J.A.R.V.I.S. → `⋮` → Allow restricted settings before enabling Accessibility.)*
            - **Zero-clone PC ADB install (best for Xiaomi 15T Pro)**:
              ```powershell
              irm https://raw.githubusercontent.com/LasseHartmann/Jarvis-on-Android/main/scripts/install_from_github.ps1 | iex
              ```
            - **Auto-updates via Obtainium**: Add `https://github.com/LasseHartmann/Jarvis-on-Android` in Obtainium.

            **Signing**: ${{ steps.signing.outputs.signed_mode }}
          files: |
            release-dist/Jarvis.apk
            release-dist/Jarvis-${{ steps.meta.outputs.tag }}.apk
            release-dist/SHA256SUMS.txt
